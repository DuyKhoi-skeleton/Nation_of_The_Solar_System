<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game RPG Vũ Trụ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- GIAO DIỆN HUD CHÍNH -->
    <div id="hud">
        <div class="hud-top-left">
            <div class="hud-item">📍 <span id="ui-map-name">Trái Đất (Sảnh Chờ)</span></div>
            <div class="hud-item">⚔️ Level: <span id="ui-level">1</span></div>
            
            <!-- Thanh Máu -->
            <div class="bar-container">
                <div id="ui-hp-bar" class="bar hp-fill"></div>
                <span class="bar-text">HP: <span id="ui-hp">100/100</span></span>
            </div>

            <!-- Thanh Kinh Nghiệm -->
            <div class="bar-container">
                <div id="ui-exp-bar" class="bar exp-fill"></div>
                <span class="bar-text">EXP: <span id="ui-exp">0/100</span></span>
            </div>

            <div class="hud-stats">
                <span>🪙 Coin: $<span id="ui-coin">0</span></span> | 
                <span>🔥 ATK: <span id="ui-atk">16</span></span> | 
                <span>🛡️ DEF: <span id="ui-def">4</span></span>
            </div>

            <div class="hud-buttons">
                <button id="btn-open-shop" class="btn-hud">🛒 Shop (B)</button>
                <button id="btn-open-inv" class="btn-hud">🎒 Hành Trang (I)</button>
                <button id="btn-open-map" class="btn-hud">🪐 Chọn Map (M)</button>
            </div>
        </div>

        <div class="hud-top-right">
            <div>FPS: <span id="ui-fps">60</span></div>
        </div>
    </div>

    <!-- NÚT MOBILE / TOUCH CONTROLS -->
    <div id="mobile-controls">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <div id="action-buttons">
            <button id="btn-skill-o" class="btn-skill btn-o">O</button>
            <button id="btn-skill-p" class="btn-skill btn-p">P</button>
            <button id="btn-skill-u" class="btn-skill btn-u">U</button>
            <button id="btn-skill-j" class="btn-skill btn-j">J</button>
            
            <button id="btn-dash" class="btn-action btn-dash">💨</button>
            <button id="btn-atk" class="btn-action btn-atk">⚔️</button>
            
            <button id="btn-skill-k" class="btn-skill btn-k">K</button>
            <button id="btn-skill-l" class="btn-skill btn-l">L</button>
        </div>
    </div>

    <!-- MODAL BẢN ĐỒ (M) -->
    <div id="map-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>🪐 BẢN ĐỒ HỆ MẶT TRỜI</h2>
            <div id="map-list-container" class="scroll-list"></div>
            <button id="btn-close-map" class="btn-close">Đóng (M / Esc)</button>
        </div>
    </div>

    <!-- MODAL HÀNH TRANG (I) -->
    <div id="inventory-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>🎒 HÀNH TRANG & BUILD TRANG BỊ</h2>
            <div id="inv-slots-container"></div>
            <button id="btn-close-inv" class="btn-close">Đóng (I / Esc)</button>
        </div>
    </div>

    <!-- MODAL CỬA HÀNG (B) -->
    <div id="shop-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>🛒 CỬA HÀNG KỸ NĂNG & TRANG BỊ</h2>
            <div id="shop-items-container" class="scroll-list"></div>
            <button id="btn-close-shop" class="btn-close">Đóng (B / Esc)</button>
        </div>
    </div>

    <!-- NÚT RESPAWN KHI CHẾT -->
    <div id="death-screen" style="display: none;">
        <h2>BẠN ĐÃ HY SINH!</h2>
        <button id="btn-respawn">Hồi Sinh</button>
    </div>

    <!-- THÔNG BÁO TẠM THỜI -->
    <div id="notice-box" class="notice-popup" style="display: none;"></div>

    <!-- SCRIPTS LOAD THEO THỨ TỰ -->
    <script src="save.js"></script>
    <script src="player.js"></script>
    <script src="enemy.js"></script>
    <script src="chunk.js"></script>
    <script src="ui.js"></script>
    <script src="script.js"></script>
</body>
</html>
